[server]
# Disable the source-file watcher in deployment. It re-crawls every imported
# module on each rerun — including the large `transformers` tree pulled in by
# latincy-diacritics, which raises torchvision import errors and thrashes the
# CPU on a 1-vCPU host, dragging out every interaction. Hot-reload is not needed
# for a deployed app.
fileWatcherType = "none"
headless = true

[browser]
gatherUsageStats = false
